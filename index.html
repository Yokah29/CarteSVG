<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage - Pays de Morlaix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .carte-container {
            flex: 2;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        svg { width: 100%; height: auto; }

        .panneau-droit {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
        }

        .vote-zone, .resultats-zone {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #4dc2d6;
            border-radius: 8px;
            margin-top: 10px;
            outline: none;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #005f99;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #003d66; }

        /* Message de feedback sous le bouton */
        #feedback-message {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }

        /* Barres de résultat */
        .resultat-item { margin-bottom: 15px; }
        .resultat-label { font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .barre-container { background: #e0e0e0; border-radius: 5px; overflow: hidden; height: 20px; }
        .barre-remplissage { height: 100%; transition: width 0.5s ease; color: white; font-size: 12px; display: flex; align-items: center; padding-left: 5px; box-sizing: border-box; }

        /* ========================================= */
        /* STYLES SVG                                */
        /* ========================================= */
        .zone-interactive { cursor: pointer; }

        .zone-interactive:hover path {
            fill: #e9fbfdd2; stroke: #005f99; transition: fill 0.3s ease, stroke 0.3s ease;
        }

        /* Texte de nom de zone (apparaît au survol) */
        .zone-interactive text.nom-zone {
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: bold; fill: #000266; stroke: white; stroke-width: 0.5; paint-order: stroke fill;
        }
        .zone-interactive:hover text.nom-zone { opacity: 1; }

        /* Compteur sur la carte (toujours visible) */
        text.compteur-carte {
            font-size: 12px; 
            font-weight: 900;
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1;
            paint-order: stroke fill;
            pointer-events: none; 
        }
    </style>
</head>

    <!-- PANNEAU DE VOTE ET RÉSULTATS -->
    <div class="panneau-droit">
        <div class="vote-zone">
            <h2>📍 Où habitez-vous ?</h2>
            <p>Indiquez votre zone et validez :</p>
            <select id="selectZone">
                <option value="">-- Choisir une zone --</option>
                <option value="MorlaixCo">Morlaix Communauté</option>
                <option value="LandivisiauCo">CC du Pays de Landivisiau</option>
                <option value="Haut-L__onCo">Haut-Léon Communauté</option>
            </select>
            <button id="btnVote">Valider mon choix</button>
            <div id="feedback-message"></div>
        </div>

        <div class="resultats-zone">
            <h2>📊 Résultats du sondage</h2>
            <div id="affichageResultats"></div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
            <script>
        const configZones = {
            "MorlaixCo": { nom: "Morlaix Communauté", couleur: "#4dc2d6" },
            "LandivisiauCo": { nom: "CC du Pays de Landivisiau", couleur: "#d09a24" },
            "Haut-L__onCo": { nom: "Haut-Léon Communauté", couleur: "#5cdc1b" }
        };

        let votes = {};

        const selectElement = document.getElementById("selectZone");
        const btnVote = document.getElementById("btnVote");
        const feedbackMsg = document.getElementById("feedback-message");
        const affichageResultats = document.getElementById("affichageResultats");

        // Demander les résultats au serveur PHP
        async function chargerResultats() {
            try {
                const response = await fetch('api/results.php'); // <-- Changement ici
                votes = await response.json();
                mettreAJourAffichage();
            } catch (error) {
                console.error("Erreur lors du chargement des résultats :", error);
            }
        }

        function mettreAJourAffichage() {
            let totalVotes = 0;
            for(let id in votes) { totalVotes += votes[id]; }

            let htmlResultats = "";

            for (const id in configZones) {
                const zone = configZones[id];
                const count = votes[id] || 0;
                const pourcentage = totalVotes === 0 ? 0 : Math.round((count / totalVotes) * 100);

                const compteurSVG = document.getElementById("count-" + id);
                if (compteurSVG) compteurSVG.textContent = count;

                htmlResultats += `
                    <div class="resultat-item">
                        <div class="resultat-label">
                            <span>${zone.nom}</span>
                            <span><strong>${count}</strong> vote(s) (${pourcentage}%)</span>
                        </div>
                        <div class="barre-container">
                            <div class="barre-remplissage" style="width: ${pourcentage}%; background-color: ${zone.couleur};"></div>
                        </div>
                    </div>
                `;
            }

            htmlResultats += `<p style="text-align:right; margin-top:10px; font-weight:bold;">Total : ${totalVotes} vote(s)</p>`;
            affichageResultats.innerHTML = htmlResultats;
        }

        // Envoyer le vote au serveur PHP
        async function ajouterVote(zoneId) {
            if(!zoneId) {
                feedbackMsg.textContent = "⚠️ Veuillez d'abord sélectionner une zone !";
                feedbackMsg.style.color = "red";
                return;
            }

            try {
                const response = await fetch('api/vote.php', { // <-- Changement ici
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone: zoneId })
                });

                const data = await response.json();

                if (data.success) {
                    votes = data.votes;
                    mettreAJourAffichage();

                    feedbackMsg.textContent = "✅ Merci ! Vote enregistré sur le serveur pour " + configZones[zoneId].nom;
                    feedbackMsg.style.color = "green";
                    selectElement.value = "";

                    setTimeout(() => { feedbackMsg.textContent = ""; }, 3000);
                }
            } catch (error) {
                feedbackMsg.textContent = "❌ Erreur de connexion au serveur.";
                feedbackMsg.style.color = "red";
                console.error("Erreur vote :", error);
            }
        }

        btnVote.addEventListener("click", function() {
            ajouterVote(selectElement.value);
        });

        document.querySelectorAll(".zone-interactive").forEach(zone => {
            zone.addEventListener("click", function() {
                ajouterVote(this.id);
            });
        });

        chargerResultats();
    </script>
